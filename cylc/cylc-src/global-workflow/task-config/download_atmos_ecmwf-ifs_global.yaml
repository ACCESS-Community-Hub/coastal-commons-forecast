## Dissemination schedule:
## https://confluence.ecmwf.int/display/DAC/Dissemination+schedule

## -- The actual configuration for the ECMWF-IFS download task
schedule:
  cycle: null

task:
  ## "source" is either the name of server to contact or a fully qualified URL. Possible values are:
  ##  - 'ecmwf' to access ECMWF's servers:
  ##  - 'aws' for data hosted by Amazon Web Services or
  ##  - 'azure' to access data hosted on Microsoft's Azure.
  source: &SOURCE azure
  model: &MODEL ifs
  resol: &RESOL 0p25

  params:
    msl: # [Mean sea level pressure]
      type: &TYPE fc
      levtype: sfc
      outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-msl_%Y%m%dT%H.grib2
      fc_horizon: &HORIZON 7D

    10u: # [10 metre U wind component]
      type: *TYPE
      levtype: sfc
      outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-10u_%Y%m%dT%H.grib2
      fc_horizon: *HORIZON

    10v: # [10 metre V wind component]
      type: *TYPE
      levtype: sfc
      outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-10v_%Y%m%dT%H.grib2
      fc_horizon: *HORIZON

    2t: # [2 metre temperature]
      type: *TYPE
      levtype: sfc
      outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-2t_%Y%m%dT%H.grib2
      fc_horizon: *HORIZON

    tprate: # [Total precipitation rate]
      type: *TYPE
      levtype: sfc
      outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-tprate_%Y%m%dT%H.grib2
      fc_horizon: *HORIZON

    r: # [Relative humidity]
      type: *TYPE
      levtype: pl  # Pressure levels
      outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-r_%Y%m%dT%H.grib2
      fc_horizon: *HORIZON

    strd: # [Surface long-wave (thermal) radiation downwards]
      type: *TYPE
      levtype: sfc
      outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-strd_%Y%m%dT%H.grib2
      fc_horizon: *HORIZON

    ssrd: # [Surface short-wave (solar) radiation downwards]
      type: *TYPE
      levtype: sfc
      outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-ssrd_%Y%m%dT%H.grib2
      fc_horizon: *HORIZON

    2d: # [2 metre dewpoint temperature]
       type: *TYPE
       levtype: sfc
       outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-2d_%Y%m%dT%H.grib2
       fc_horizon: *HORIZON

    ssr: # [Surface short-wave (solar) net radiation]
       type: *TYPE
       levtype: sfc
       outfile: ${oc.env:CYLC_TASK_WORK_DIR}/ecmwf_ifs_oper_fc-ssr_%Y%m%dT%H.grib2
       fc_horizon: *HORIZON

## -- Hydra-specific settings
## The following settings ensure no "outputs" directory
## nor logging files are created
defaults:
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  output_subdir: null
  run:
    dir: .
